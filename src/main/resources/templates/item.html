<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<form th:action="${mode}" method="post" th:object="${menuItem}">
		<p th:text="${message}"></p>
		<input type="hidden" id="id" th:field="*{id}">
		<label for="itemName">Item Name:</label>
		<input type="text" id="itemName" th:field="*{itemName}"><br><br>
		<label for="price">Price:</label>
		<input type="number" id="price" th:field="*{price}"><br><br>
		<label for="quantityAvailable">Available Quantity:</label>
		<input type="number" id="quantityAvailable" th:field="*{quantityAvailable}"><br><br>
		<label for="category">Category:</label>
		<input type="text" id="category" th:field="*{category}"><br><br>
		<input type="submit" value="Submit">
	</form>
</body>
</html>
