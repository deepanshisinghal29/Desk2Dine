<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Faculty Registration</title></head>
<body>
	<form th:object="${faculty}" th:action="@{/faculty/register}" method="post">
		<h2>Register Faculty</h2>
		<label>Name:</label><br>
		<input type="text" th:field="*{name}" required><br>
		<label>Id:</label><br>
		<input type="number" th:field="*{id}" required><br>
		<label>Password:</label><br>
		<input type="password" th:field="*{password}" required><br>
		<label>Gender:</label><br>
		<select th:field="*{gender}" required>
			<option value="">Select Gender</option>
			<option value="Male">Male</option>
			<option value="Female">Female</option>
		</select>
		<br>
		<br><button type="submit">Register</button>
	</form>
	<h3 th:text="${message}"></h3>
</body>
</html>
